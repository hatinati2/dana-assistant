name: Dana panel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile panel modules
        run: python -m py_compile symbols.py orders_api.py orders_store.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
